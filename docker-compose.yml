version: '3.8'

services:
  # Database Service
  postgres:
    image: postgres:16-alpine
    container_name: task_collab_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: task_collaboration_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend Express API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: task_collab_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/task_collaboration_db?schema=public
      JWT_ACCESS_SECRET: super_secret_access_key_change_in_production_123!
      JWT_REFRESH_SECRET: super_secret_refresh_key_change_in_production_456!
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma db push && npm run prisma:seed && node dist/server.js"

  # Frontend Nginx React SPA Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: task_collab_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
